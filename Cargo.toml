[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/linkdrop-core",
  "crates/linkdrop-discovery",
  "crates/linkdrop-identity",
  "crates/linkdrop-protocol",
  "crates/linkdrop-transfer",
  "crates/linkdrop-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Linkdrop contributors"]

[workspace.dependencies]
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
rcgen = "0.13"
rustls-pki-types = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
x509-parser = { version = "0.16", features = ["verify"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"
